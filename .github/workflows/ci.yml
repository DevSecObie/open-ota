name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320  # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      # The bsdiff engine is Rust compiled to WebAssembly. Its pinned toolchain
      # comes from packages/bsdiff/crate/rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master on 2026-11-03
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: packages/bsdiff/crate
      # The committed module must be what the crate builds. The build remaps
      # source and registry paths, so the same toolchain yields the same bytes
      # on any host.
      - run: pnpm --filter @open-ota/bsdiff build:wasm
      - run: git diff --exit-code -- packages/bsdiff/bsdiff.wasm
      # Conformance tests hand our patches to the reference bspatch.
      - run: sudo apt-get update && sudo apt-get install -y bsdiff
      - run: pnpm check
      - run: pnpm --filter dashboard lint
      - run: pnpm test
      - run: pnpm build
