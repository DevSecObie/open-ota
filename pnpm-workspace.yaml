  'body-parser@>=2 <2.4.0': ^2.4.0
  'brace-expansion@<1.1.20': ^1.1.20
  'brace-expansion@>=5 <5.0.11': ^5.0.11
  'proxy-addr@<2.0.8': ^2.0.8
  'seroval@<1.6.8': ^1.6.8
  'sharp@<0.35.5': ^0.35.5
  'source-map-js@<1.2.2': ^1.2.2
  'systeminformation@<5.33.16': ^5.33.16
  'undici@>=7 <7.30.1': ^7.30.1
  'undici@>=8 <8.12.2': ^8.12.2
